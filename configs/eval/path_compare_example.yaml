data_root: ./data

path:
  num_points: 31
  bn_recalib_batches: 20
  observed:
    selection: milestones
    milestone_epochs:
      - 1
      - 5
      - 10
      - 20
      - 40
      - 60
      - 80
      - 100
    epochs: []

barrier:
  definition: max_minus_linear_baseline
  thresholds:
    - 0.01
    - 0.05
    - 0.1
    - 0.2

evaluation:
  batch_size: 256
  bn_batch_size: 256
  split: val
  val_size: 5000
  split_seed: 42

data:
  num_workers: 0
  pin_memory: true
